name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test (race detector)
        run: go test -race -count=1 -cover ./...
      - name: build
        run: go build ./...
      - name: benchmark smoke test
        run: go test -run '^$' -bench . -benchtime=200ms ./internal/limiter
